name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gates:
    # Job name is the literal string GitHub's branch-protection required
    # status check on `main` matches against — keep byte-identical, or
    # update it in the same PR at Settings → Branches → main → required
    # status checks (docs/architecture.md "Merge Enforcement"; #45, #155).
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails the run if lines or statements drop below 90% (ADR 0008).
      - name: Test with coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

  a11y:
    name: a11y (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Axe a11y suite (Playwright)
        run: npm run test:e2e:a11y

  lighthouse:
    name: lighthouse (perf & a11y budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Asserts FCP, Accessibility, and Best Practices budgets from NFR-01
      # (ADR 0036). Starts its own `next start` server against the build
      # above and audits it three times with headless Chrome.
      - name: Lighthouse CI budget
        run: npm run test:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
